services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: monument_capture
      POSTGRES_PASSWORD: ${LOCAL_DB_ADMIN_PASSWORD:?Set LOCAL_DB_ADMIN_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - monument_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monument_capture"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  monument_database:
